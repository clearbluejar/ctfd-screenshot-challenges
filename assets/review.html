<!DOCTYPE html>
<html>
<head>
    <title>Screenshot Reviews - CTFd Admin</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .review-card { transition: opacity 0.3s; }
        .review-card.processed { opacity: 0.5; }

        .screenshot-thumb {
            max-width: 300px;
            max-height: 200px;
            cursor: pointer;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        /* Modal zoom: magnifier overlay shown only inside the modal */
        #imageModal .modal-body {
            overflow: auto;
            max-height: 90vh;
            position: relative;
        }
        .modal-image-wrapper {
            position: relative;
            display: inline-block;
            cursor: zoom-in;
        }
        .modal-image-wrapper .zoom-hint {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .modal-image-wrapper:hover .zoom-hint {
            opacity: 1;
        }
        .screenshot-full {
            max-width: 100%;
            max-height: 85vh;
            display: block;
            user-select: none;
        }
        .modal-image-wrapper.zoomed {
            cursor: zoom-out;
        }
        .modal-image-wrapper.zoomed .screenshot-full {
            max-width: none;
            max-height: none;
        }
        .image-load-error {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f8f9fa;
            border: 2px dashed #dc3545;
            border-radius: 4px;
            min-height: 120px;
            color: #6c757d;
        }
        .image-load-error i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #dc3545;
        }

        .status-pending { color: #fd7e14; font-weight: bold; }
        .status-approved { color: #28a745; font-weight: bold; }
        .status-rejected { color: #dc3545; font-weight: bold; }
        .filter-bar { background: white; border-bottom: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">CTFd Admin</a>
            <div>
                <button class="btn btn-outline-light btn-sm me-2" onclick="showTab('reviews')" id="tab-reviews">Reviews</button>
                <button class="btn btn-outline-light btn-sm me-2" onclick="showTab('gallery')" id="tab-gallery">Gallery / Storage</button>
                <button class="btn btn-outline-light btn-sm" onclick="showTab('llm')" id="tab-llm">LLM Judge</button>
            </div>
        </div>
    </nav>

    <div class="filter-bar p-3">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-auto">
                    <label class="form-label mb-0 me-2"><strong>Status:</strong></label>
                    <select id="status-filter" class="form-select form-select-sm d-inline-block" style="width: auto;">
                        <option value="pending" selected>Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0 me-2"><strong>Challenge:</strong></label>
                    <select id="challenge-filter" class="form-select form-select-sm d-inline-block" style="width: auto;">
                        <option value="">All Challenges</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-primary" onclick="loadReviews()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                <div class="col-auto ms-auto">
                    <span id="review-count" class="text-muted"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid p-4" id="reviews-panel">
        <div id="reviews-container" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid p-4" id="gallery-panel" style="display:none;">
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5>Storage Usage</h5>
                        <div id="storage-stats" class="text-muted">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-auto">
                <label class="form-label mb-0 me-2"><strong>Show:</strong></label>
                <select id="gallery-status-filter" class="form-select form-select-sm d-inline-block" style="width:auto;" onchange="loadGallery()">
                    <option value="all">All</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <div class="col-auto">
                <button class="btn btn-sm btn-danger" onclick="deleteSelected()" id="delete-selected-btn" disabled>
                    <i class="fas fa-trash"></i> Delete Selected Files
                </button>
            </div>
            <div class="col-auto">
                <label class="form-check-label">
                    <input type="checkbox" class="form-check-input" id="select-all-gallery" onchange="toggleSelectAll()"> Select all
                </label>
            </div>
        </div>
        <div id="gallery-container" class="row g-2"></div>
    </div>

    <div class="container-fluid p-4" id="llm-panel" style="display:none;">
        <div class="row g-3">
            <div class="col-12 col-xl-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h5 class="mb-0">LLM Judge Settings</h5>
                            <span id="llm-config-pill" class="badge bg-secondary">Disabled</span>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="llm-enabled">
                            <label class="form-check-label" for="llm-enabled">Enable LLM scoring controls</label>
                        </div>
                        <div class="mb-3">
                            <label for="llm-base-url" class="form-label">OpenAI-compatible base URL</label>
                            <input type="url" class="form-control" id="llm-base-url" placeholder="http://localhost:11434/v1">
                        </div>
                        <div class="mb-3">
                            <label for="llm-api-key" class="form-label">API key</label>
                            <input type="password" class="form-control" id="llm-api-key" autocomplete="off">
                            <div id="llm-api-key-state" class="form-text"></div>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="llm-clear-api-key">
                                <label class="form-check-label" for="llm-clear-api-key">Clear saved API key</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="llm-model" class="form-label">Model</label>
                            <div class="input-group">
                                <select id="llm-model" class="form-select"></select>
                                <button type="button" class="btn btn-outline-secondary" onclick="refreshLlmModels()">
                                    <i class="fas fa-sync-alt"></i> Refresh Models
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="llm-prompt" class="form-label">Judge prompt</label>
                            <textarea id="llm-prompt" class="form-control" rows="6"></textarea>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-primary" onclick="saveLlmConfig()">
                                <i class="fas fa-save"></i> Save Settings
                            </button>
                            <span id="llm-config-status" class="small text-muted"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-xl-4">
                <div class="card">
                    <div class="card-body">
                        <h6>Review Output</h6>
                        <p class="small text-muted mb-2">Scores and feedback appear only on this admin review page.</p>
                        <p class="small text-muted mb-0">Use a vision-capable model. Many OpenAI-compatible backends list all models without image capability metadata.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">Screenshot</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <span id="modal-image-wrapper" class="modal-image-wrapper">
                        <img id="modal-image" class="screenshot-full" src="">
                        <span class="zoom-hint"><i class="fas fa-search-plus"></i> Click to zoom</span>
                    </span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" id="modal-prev-btn" onclick="showPreviousImage()" disabled>
                        <i class="fas fa-chevron-left"></i> Previous
                    </button>
                    <span id="modal-image-counter" class="text-muted small mx-2"></span>
                    <button type="button" class="btn btn-outline-secondary" id="modal-next-btn" onclick="showNextImage()" disabled>
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="download-modal-btn" onclick="downloadCurrentImage()">
                        <i class="fas fa-download"></i> Download Original
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>var CSRF_NONCE = "{{ nonce }}";</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/plugins/screenshot_challenges/assets/review.js"></script>
</body>
</html>
