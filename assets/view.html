{% extends "challenge.html" %}

{% block input %}
  <input id="challenge-id" class="challenge-id" type="hidden" value="{{ challenge.id }}">
  <div id="screenshot-status-banner" x-init="window.__loadScreenshotStatus && window.__loadScreenshotStatus({{ challenge.id }})"></div>
  <style>
    #screenshot-paste-zone {
      border: 2px dashed var(--bs-border-color, #adb5bd);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      background-color: var(--bs-tertiary-bg, rgba(0,0,0,0.03));
      color: var(--bs-body-color, inherit);
      cursor: pointer;
      outline: none;
    }
    #screenshot-paste-zone small {
      color: var(--bs-secondary-color, #6c757d) !important;
    }
    #screenshot-paste-zone kbd {
      background-color: var(--bs-secondary-bg, #e9ecef);
      color: var(--bs-body-color, #212529);
      border: 1px solid var(--bs-border-color, #adb5bd);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.85em;
    }
  </style>
  <div class="w-100" x-init="window.__initScreenshotPaste && window.__initScreenshotPaste()">
    <div id="screenshot-paste-zone"
         tabindex="0"
         onclick="document.getElementById('screenshot-file').click()">
      <i class="fas fa-paste"></i>
      <strong>Paste a screenshot</strong>
      <small class="d-block">Press <kbd>Ctrl</kbd>+<kbd>V</kbd> (or <kbd>Cmd</kbd>+<kbd>V</kbd> on Mac), or click to choose a file</small>
    </div>
    <div id="screenshot-preview-wrapper" style="display:none;margin-top:8px;">
      <div class="d-flex align-items-start gap-2">
        <img id="screenshot-preview" style="max-width:120px;max-height:80px;border:1px solid var(--bs-border-color, #dee2e6);border-radius:4px;">
        <div class="flex-grow-1">
          <div id="screenshot-preview-name" class="small fw-bold text-truncate"></div>
          <div id="screenshot-preview-size" class="small text-muted"></div>
          <button type="button" class="btn btn-sm btn-outline-danger mt-1" onclick="window.__clearScreenshot()">
            <i class="fas fa-times"></i> Clear
          </button>
        </div>
      </div>
    </div>
    <input
        id="screenshot-file" class="form-control mt-2 d-none"
        type="file" accept="image/*"
        onchange="window.__handleFileSelect && window.__handleFileSelect(event)"
    >
  </div>
{% endblock %}

{% block submit %}
  <button
      id="challenge-submit"
      class="challenge-submit btn btn-outline-secondary w-100 h-100" type="submit"
      @click.debounce.500ms="response = await window.__screenshotSubmit(id); await renderSubmissionResponse();"
  >
    Submit Screenshot
  </button>
{% endblock %}
